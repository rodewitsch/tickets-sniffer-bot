name: Deploy Mini App to GitHub Pages

# Публикует miniapp/ (Telegram Mini App) в GitHub Pages, чтобы
# lib/config.js → MINIAPP_URL = https://rodewitsch.github.io/tickets-telegram-bot/
# указывал на реально размещённую страницу.

on:
  push:
    branches: [main]
    paths: ['miniapp/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
